<?xml version="1.0" encoding="UTF-8"?>
<!-- Mahlamäen Kauneusstudio logo.
     Uses currentColor for stroke so the parent element's color controls the rendered colour.
     Dark backgrounds: set color: #faf8f4. Light backgrounds: set color: #2a3830. -->
<svg viewBox="150 80 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mahlamäen Kauneusstudio – logo">
  <path fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="miter" stroke-miterlimit="4"
    d="M 180 200 L 180 100 L 250 160 L 320 100 L 320 200"/>
  <path fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"
    d="M 250 160 C 220 190, 220 230, 250 250 C 280 230, 280 190, 250 160 Z"/>
  <line stroke="currentColor" stroke-width="4" stroke-linecap="round" x1="250" y1="160" x2="250" y2="250"/>
  <line stroke="currentColor" stroke-width="4" stroke-linecap="round" x1="250" y1="205" x2="235" y2="190"/>
  <line stroke="currentColor" stroke-width="4" stroke-linecap="round" x1="250" y1="205" x2="265" y2="190"/>
  <line stroke="currentColor" stroke-width="4" stroke-linecap="round" x1="250" y1="225" x2="238" y2="215"/>
  <line stroke="currentColor" stroke-width="4" stroke-linecap="round" x1="250" y1="225" x2="262" y2="215"/>
</svg>
