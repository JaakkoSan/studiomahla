<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hallinta · Mahlamäen Kauneusstudio</title>
  <meta name="description" content="Ennakkovarausten hallintapaneeli.">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <meta name="theme-color" content="#3d5247">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --green-dark: #3d5247;
      --green-mid: #4a6157;
      --cream: #f5f0e8;
      --cream-warm: #ede7db;
      --pink: #c8997a;
      --pink-pale: #e8cdb8;
      --white: #faf8f4;
      --text-dark: #2a3830;
      --text-mid: #4a5e55;
      --danger: #b85a3a;
      --success: #4a6157;

      --font-serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --font-sans: "Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      --nav-height: 64px;
      --section-px: clamp(20px, 4vw, 40px);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      font-weight: 300;
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-dark);
      background: var(--cream);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--pink); text-decoration: underline; text-underline-offset: 3px; }
    a:hover { color: var(--green-dark); }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

    h1, h2 {
      font-family: var(--font-serif);
      font-weight: 400;
      margin: 0;
      letter-spacing: -0.01em;
      color: var(--text-dark);
    }

    :focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; border-radius: 2px; }
    :focus:not(:focus-visible) { outline: none; }

    /* TOP BAR */
    .topbar {
      height: var(--nav-height);
      background: var(--green-dark);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--section-px);
    }
    .topbar__brand {
      display: flex; align-items: center; gap: 12px;
      color: var(--white); text-decoration: none;
    }
    .topbar__brand svg { width: 24px; height: 24px; color: var(--white); }
    .topbar__title {
      font-family: var(--font-sans);
      font-weight: 400; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    }
    .topbar__logout {
      font-family: var(--font-sans);
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--pink-pale);
      padding: 8px 12px;
      border-radius: 2px;
    }
    .topbar__logout:hover { color: var(--white); background: rgba(255,255,255,0.05); }

    /* PAGE */
    .page { padding: 32px var(--section-px) 80px; max-width: 1100px; margin: 0 auto; }
    .page__head {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 16px;
      margin-bottom: 24px;
    }
    .page__head h1 { font-size: clamp(28px, 4vw, 40px); }
    .page__meta {
      font-size: 13px; color: var(--text-mid); letter-spacing: 0.04em;
    }
    .refresh-btn {
      margin-left: auto;
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      padding: 8px 14px; border: 1px solid rgba(74, 94, 85, 0.25); border-radius: 2px;
      color: var(--text-mid); background: var(--white);
      min-height: 36px;
    }
    .refresh-btn:hover { background: var(--cream-warm); color: var(--text-dark); }

    /* LOGIN */
    .login-card {
      max-width: 420px;
      margin: 80px auto 0;
      background: var(--white);
      border-radius: 4px;
      padding: 40px;
      border: 1px solid rgba(74, 94, 85, 0.08);
      border-left: 4px solid var(--pink);
    }
    .login-card h2 {
      font-size: 26px; margin-bottom: 18px;
    }
    .login-card label {
      display: block;
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--text-mid); margin-bottom: 8px; margin-top: 12px;
    }
    .login-card input {
      width: 100%; font: inherit; font-size: 15px;
      padding: 12px 14px; min-height: 44px;
      border: 1px solid rgba(74, 94, 85, 0.2); border-radius: 2px;
      background: var(--white); color: var(--text-dark);
    }
    .login-card input:focus {
      outline: none; border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink);
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px;
      padding: 12px 22px; min-height: 44px;
      font-family: var(--font-sans);
      font-weight: 400; font-size: 12px;
      letter-spacing: 0.18em; text-transform: uppercase;
      background: var(--pink); color: var(--white);
      border-radius: 2px;
    }
    .btn:hover { background: #b6876a; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn--block { width: 100%; margin-top: 24px; }
    .btn--small { padding: 8px 14px; font-size: 11px; }
    .btn--danger { background: var(--danger); }
    .btn--danger:hover { background: #a04d31; }

    /* BOOKING CARDS */
    .empty {
      text-align: center; padding: 60px 24px;
      background: var(--white); border-radius: 4px;
      color: var(--text-mid); font-size: 15px;
    }
    .bookings { display: flex; flex-direction: column; gap: 16px; }
    .booking {
      background: var(--white); border-radius: 4px;
      padding: 24px; border: 1px solid rgba(74, 94, 85, 0.08);
      display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center;
    }
    @media (max-width: 640px) {
      .booking { grid-template-columns: 1fr; }
      .booking__actions { justify-self: stretch; }
      .booking__actions .btn { width: 100%; }
    }
    .booking__name {
      font-family: var(--font-serif);
      font-size: 22px; font-weight: 400;
      color: var(--text-dark); margin: 0 0 6px;
    }
    .booking__meta {
      display: flex; flex-wrap: wrap; gap: 6px 18px;
      font-size: 13px; color: var(--text-mid);
    }
    .booking__meta a {
      color: var(--text-mid); text-decoration: underline; text-underline-offset: 3px;
    }
    .booking__meta a:hover { color: var(--pink); }
    .booking__date { font-size: 12px; color: var(--text-mid); margin-top: 8px; letter-spacing: 0.04em; }
    .booking__stripe {
      font-family: monospace; font-size: 11px;
      color: var(--text-mid); margin-top: 4px;
    }
    .booking__actions {
      display: flex; gap: 8px; align-items: center;
    }

    /* TOAST */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: var(--green-dark); color: var(--white);
      padding: 14px 22px; border-radius: 4px; font-size: 14px;
      max-width: calc(100vw - 32px); z-index: 200;
      opacity: 0;
      transition: opacity .25s ease, transform .25s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }
    .toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast--error { background: var(--danger); }
    .toast--success { background: var(--success); }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(42, 56, 48, 0.5);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 150;
    }
    .modal {
      background: var(--white); border-radius: 4px;
      max-width: 460px; width: 100%;
      padding: 28px; border-left: 4px solid var(--pink);
    }
    .modal h2 { font-size: 22px; margin-bottom: 12px; }
    .modal p { font-size: 15px; line-height: 1.7; color: var(--text-mid); margin: 0 0 20px; }
    .modal__actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
    .btn--secondary {
      background: transparent; color: var(--text-mid);
      border: 1px solid rgba(74, 94, 85, 0.25);
    }
    .btn--secondary:hover { background: var(--cream); color: var(--text-dark); }

    [hidden] { display: none !important; }
  </style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="topbar__brand" title="Etusivulle">
    <svg viewBox="150 80 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="miter" stroke-miterlimit="4" d="M 180 200 L 180 100 L 250 160 L 320 100 L 320 200"/>
      <path fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" d="M 250 160 C 220 190, 220 230, 250 250 C 280 230, 280 190, 250 160 Z"/>
      <line stroke="currentColor" stroke-width="4" stroke-linecap="round" x1="250" y1="160" x2="250" y2="250"/>
      <line stroke="currentColor" stroke-width="4" stroke-linecap="round" x1="250" y1="205" x2="235" y2="190"/>
      <line stroke="currentColor" stroke-width="4" stroke-linecap="round" x1="250" y1="205" x2="265" y2="190"/>
      <line stroke="currentColor" stroke-width="4" stroke-linecap="round" x1="250" y1="225" x2="238" y2="215"/>
      <line stroke="currentColor" stroke-width="4" stroke-linecap="round" x1="250" y1="225" x2="262" y2="215"/>
    </svg>
    <span class="topbar__title">Hallinta · Ennakkovaraukset</span>
  </a>
  <button type="button" class="topbar__logout" id="logoutBtn" hidden>Kirjaudu ulos</button>
</header>

<main class="page">
  <!-- LOGIN -->
  <section class="login-card" id="loginView" hidden>
    <h2>Kirjaudu sisään</h2>
    <p style="font-size:14px;line-height:1.7;color:var(--text-mid);margin:0;">
      Anna järjestelmänvalvojan salasana päästäksesi ennakkovarausten hallintaan.
    </p>
    <form id="loginForm">
      <label for="adminPwd">Salasana</label>
      <input type="password" id="adminPwd" autocomplete="current-password" required>
      <button type="submit" class="btn btn--block" id="loginBtn">Kirjaudu sisään</button>
    </form>
  </section>

  <!-- BOOKINGS -->
  <section id="bookingsView" hidden>
    <div class="page__head">
      <h1>Aktiiviset ennakkovaraukset</h1>
      <span class="page__meta" id="bookingsMeta"></span>
      <button type="button" class="refresh-btn" id="refreshBtn">↻ Päivitä</button>
    </div>

    <div id="bookingsList" class="bookings"></div>
    <div id="bookingsEmpty" class="empty" hidden>Ei aktiivisia ennakkovarauksia.</div>
    <div id="bookingsError" class="empty" style="color:var(--danger);" hidden></div>
  </section>
</main>

<!-- CHARGE CONFIRMATION MODAL -->
<div class="modal-overlay" id="chargeModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="chargeModalTitle">
    <h2 id="chargeModalTitle">Vahvista veloitus</h2>
    <p id="chargeModalText"></p>
    <div class="modal__actions">
      <button type="button" class="btn btn--secondary" id="chargeCancelBtn">Peruuta</button>
      <button type="button" class="btn" id="chargeConfirmBtn">Veloita 190 €</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  (function () {
    'use strict';

    var STORAGE_KEY = 'mahla_admin_pwd_v1';

    var loginView    = document.getElementById('loginView');
    var bookingsView = document.getElementById('bookingsView');
    var loginForm    = document.getElementById('loginForm');
    var loginBtn     = document.getElementById('loginBtn');
    var adminPwdEl   = document.getElementById('adminPwd');
    var logoutBtn    = document.getElementById('logoutBtn');
    var refreshBtn   = document.getElementById('refreshBtn');
    var bookingsList = document.getElementById('bookingsList');
    var bookingsEmpty= document.getElementById('bookingsEmpty');
    var bookingsError= document.getElementById('bookingsError');
    var bookingsMeta = document.getElementById('bookingsMeta');
    var toast        = document.getElementById('toast');
    var modal        = document.getElementById('chargeModal');
    var modalText    = document.getElementById('chargeModalText');
    var modalConfirm = document.getElementById('chargeConfirmBtn');
    var modalCancel  = document.getElementById('chargeCancelBtn');

    var pendingChargeCustomerId = null;
    var toastTimer = null;

    function getPwd() {
      try { return localStorage.getItem(STORAGE_KEY) || ''; } catch (e) { return ''; }
    }
    function setPwd(p) {
      try { localStorage.setItem(STORAGE_KEY, p); } catch (e) {}
    }
    function clearPwd() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    }

    function showToast(msg, kind) {
      toast.textContent = msg;
      toast.classList.remove('toast--error', 'toast--success');
      if (kind === 'error')   toast.classList.add('toast--error');
      if (kind === 'success') toast.classList.add('toast--success');
      toast.classList.add('is-visible');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.remove('is-visible');
      }, 4500);
    }

    function fmtDate(unixSeconds) {
      try {
        return new Date(unixSeconds * 1000).toLocaleString('fi-FI', {
          dateStyle: 'short', timeStyle: 'short',
        });
      } catch (e) { return ''; }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function showLogin() {
      loginView.hidden = false;
      bookingsView.hidden = true;
      logoutBtn.hidden = true;
      setTimeout(function () { adminPwdEl.focus(); }, 50);
    }
    function showBookings() {
      loginView.hidden = true;
      bookingsView.hidden = false;
      logoutBtn.hidden = false;
    }

    async function login(pwd) {
      loginBtn.disabled = true;
      loginBtn.textContent = 'Kirjaudutaan…';
      try {
        var res = await fetch('/api/list-bookings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-password': pwd },
          body: '{}'
        });
        if (res.status === 401) {
          showToast('Väärä salasana.', 'error');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Kirjaudu sisään';
          return;
        }
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(data.error || 'Kirjautuminen epäonnistui');
        setPwd(pwd);
        showBookings();
        renderBookings(data.bookings || []);
      } catch (err) {
        showToast(err.message || 'Kirjautuminen epäonnistui', 'error');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Kirjaudu sisään';
      }
    }

    async function loadBookings() {
      var pwd = getPwd();
      if (!pwd) { showLogin(); return; }

      refreshBtn.disabled = true;
      refreshBtn.textContent = '↻ Päivittää…';
      bookingsError.hidden = true;
      try {
        var res = await fetch('/api/list-bookings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-password': pwd },
          body: '{}'
        });
        if (res.status === 401) {
          clearPwd();
          showLogin();
          showToast('Sessio vanheni — kirjaudu uudelleen.', 'error');
          return;
        }
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(data.error || 'Varauksien hakeminen epäonnistui');
        renderBookings(data.bookings || []);
      } catch (err) {
        bookingsError.textContent = err.message || 'Varauksien hakeminen epäonnistui';
        bookingsError.hidden = false;
        bookingsList.innerHTML = '';
        bookingsEmpty.hidden = true;
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = '↻ Päivitä';
      }
    }

    function renderBookings(bookings) {
      bookingsMeta.textContent = bookings.length + ' kpl';
      bookingsList.innerHTML = '';
      bookingsError.hidden = true;

      if (bookings.length === 0) {
        bookingsEmpty.hidden = false;
        return;
      }
      bookingsEmpty.hidden = true;

      var html = '';
      bookings.forEach(function (b) {
        var stripeUrl = 'https://dashboard.stripe.com/customers/' + encodeURIComponent(b.id);
        html +=
          '<article class="booking" data-id="' + escapeHtml(b.id) + '">' +
            '<div class="booking__info">' +
              '<h2 class="booking__name">' + escapeHtml(b.name || '—') + '</h2>' +
              '<div class="booking__meta">' +
                (b.email ? '<span><a href="mailto:' + escapeHtml(b.email) + '">' + escapeHtml(b.email) + '</a></span>' : '') +
                (b.phone ? '<span><a href="tel:' + escapeHtml(b.phone.replace(/\s/g, '')) + '">' + escapeHtml(b.phone) + '</a></span>' : '') +
              '</div>' +
              '<div class="booking__date">Varattu: ' + escapeHtml(fmtDate(b.created)) + '</div>' +
              '<div class="booking__stripe">' +
                '<a href="' + stripeUrl + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(b.id) + ' ↗</a>' +
              '</div>' +
            '</div>' +
            '<div class="booking__actions">' +
              (b.hasPaymentMethod
                ? '<button type="button" class="btn charge-btn">Veloita 190 €</button>'
                : '<span style="font-size:12px;color:var(--danger);">Ei korttia</span>') +
            '</div>' +
          '</article>';
      });
      bookingsList.innerHTML = html;
    }

    function askConfirmCharge(customerId, customerName) {
      pendingChargeCustomerId = customerId;
      modalText.textContent = 'Veloitetaan asiakkaalta ' + (customerName || customerId) +
        ' 190 € (sis. alv 25,5 %) ennakkovarauksesta. Kortti veloitetaan välittömästi.';
      modal.hidden = false;
      modalConfirm.disabled = false;
      modalConfirm.textContent = 'Veloita 190 €';
      setTimeout(function () { modalCancel.focus(); }, 50);
    }
    function closeModal() {
      modal.hidden = true;
      pendingChargeCustomerId = null;
    }

    async function confirmCharge() {
      if (!pendingChargeCustomerId) return;
      var pwd = getPwd();
      if (!pwd) { closeModal(); showLogin(); return; }

      modalConfirm.disabled = true;
      modalConfirm.textContent = 'Veloitetaan…';

      try {
        var res = await fetch('/api/charge-booking', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-password': pwd },
          body: JSON.stringify({ customerId: pendingChargeCustomerId })
        });
        var data = await res.json().catch(function () { return {}; });

        if (res.status === 401) {
          clearPwd();
          closeModal();
          showLogin();
          showToast('Sessio vanheni — kirjaudu uudelleen.', 'error');
          return;
        }
        if (!res.ok) {
          throw new Error(data.error || 'Veloitus epäonnistui');
        }

        if (data.ok) {
          showToast('Veloitus onnistui!', 'success');
        } else if (data.needsAction) {
          showToast('Maksu vaatii vahvistuksen. Lähetä asiakkaalle vahvistuslinkki Stripe Dashboardista.', 'error');
        } else {
          showToast(data.error || 'Maksu ei mennyt heti läpi.', 'error');
        }
        closeModal();
        loadBookings();
      } catch (err) {
        modalConfirm.disabled = false;
        modalConfirm.textContent = 'Veloita 190 €';
        showToast(err.message || 'Veloitus epäonnistui', 'error');
      }
    }

    /* ----- WIRING ----- */
    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var pwd = adminPwdEl.value;
      if (!pwd) return;
      login(pwd);
    });
    logoutBtn.addEventListener('click', function () {
      clearPwd();
      adminPwdEl.value = '';
      showLogin();
      showToast('Kirjauduit ulos.', 'success');
    });
    refreshBtn.addEventListener('click', loadBookings);

    bookingsList.addEventListener('click', function (e) {
      var btn = e.target.closest('.charge-btn');
      if (!btn) return;
      var article = btn.closest('.booking');
      var customerId = article && article.getAttribute('data-id');
      var nameEl = article && article.querySelector('.booking__name');
      var name = nameEl ? nameEl.textContent : '';
      if (customerId) askConfirmCharge(customerId, name);
    });

    modalCancel.addEventListener('click', closeModal);
    modal.addEventListener('click', function (e) {
      if (e.target === modal) closeModal(); // click backdrop
    });
    modalConfirm.addEventListener('click', confirmCharge);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !modal.hidden) closeModal();
    });

    /* ----- BOOT ----- */
    if (getPwd()) {
      showBookings();
      loadBookings();
    } else {
      showLogin();
    }
  })();
</script>

</body>
</html>
